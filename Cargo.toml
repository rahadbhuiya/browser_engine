[package]
name = "browser_engine"
version = "0.1.0"
edition = "2021"
authors = ["Rahad Bhuiya <rahadbhuiya2021@gmail.com>"]
description = "A modular, GPU-accelerated, security-first web browser engine built from scratch in Rust."
repository = "https://github.com/rahadbhuiya/browser_engine"
license = "MIT"
keywords = ["browser", "browser-engine", "rendering-engine", "wgpu", "rust"]
categories = ["web-programming", "rendering"]

[dependencies]
wgpu = "23.0"
winit = "0.29"
wgpu_glyph = "0.23"
bytemuck = { version = "1.16", features = ["derive"] }
pollster = "0.3"
log = "0.4"
env_logger = "0.11"
url = "2.5"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
webpki-roots = "0.26"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true