[package]
name = "browser_engine"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
wgpu = "23.0"
winit = "0.29"
wgpu_glyph = "0.23"
bytemuck = { version = "1.16", features = ["derive"] }
pollster = "0.3"
log = "0.4"
env_logger = "0.11"
url = "2.5"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
webpki-roots = "0.26"